<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프리미엄 스마트 메모장</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --container-bg: #ffffff;
            --text-color: #333;
            --border-color: #ddd;
            --primary-color: #0070f3;
        }

        [data-theme='dark'] {
            --bg-color: #1a1a1a;
            --container-bg: #2d2d2d;
            --text-color: #ececec;
            --border-color: #444;
            --primary-color: #3291ff;
        }

        body { font-family: 'Apple SD Gothic Neo', sans-serif; background-color: var(--bg-color); color: var(--text-color); transition: 0.3s; display: flex; justify-content: center; padding: 20px; }
        .container { background: var(--container-bg); width: 100%; max-width: 800px; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 8px; }
        
        button { padding: 8px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-blue { background: var(--primary-color); color: white; }
        .btn-dark { background: #555; color: white; }
        .btn-green { background: #28a745; color: white; }
        .btn-red { background: #ff4d4d; color: white; }
        button:hover { opacity: 0.8; }

        .main-layout { display: grid; grid-template-columns: 200px 1fr; gap: 20px; }
        .memo-list { border-right: 1px solid var(--border-color); padding-right: 15px; }
        .memo-item { padding: 10px; border-bottom: 1px solid var(--border-color); cursor: pointer; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .memo-item:hover { background: rgba(0,0,0,0.05); }
        .active-memo { font-weight: bold; color: var(--primary-color); background: rgba(0,112,243,0.1); }

        input#memoTitle { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border-color); border-radius: 5px; background: var(--container-bg); color: var(--text-color); box-sizing: border-box; }
        textarea { width: 100%; height: 400px; padding: 15px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 16px; resize: none; box-sizing: border-box; outline: none; background: var(--container-bg); color: var(--text-color); }
        
        .status-bar { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: #888; }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div class="header">
        <h2>🚀 스마트 메모장</h2>
        <div class="btn-group">
            <button class="btn-dark" onclick="toggleDarkMode()">테마 변경</button>
            <button class="btn-green" onclick="downloadPDF()">PDF 저장</button>
            <button class="btn-red" onclick="deleteMemo()">삭제</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="memo-list">
            <button class="btn-blue" style="width: 100%; margin-bottom: 10px;" onclick="createNewMemo()">+ 새 메모</button>
            <div id="memoItems"></div>
        </div>

        <div id="pdf-area">
            <input type="text" id="memoTitle" placeholder="메모 제목을 입력하세요..." oninput="autoSave()">
            <textarea id="memoEditor" placeholder="내용을 입력하면 자동으로 저장됩니다..." oninput="autoSave()"></textarea>
            <div class="status-bar">
                <span id="saveStatus">상태: 대기 중</span>
                <span id="charCount">글자 수: 0</span>
            </div>
        </div>
    </div>
</div>

<script>
    let memos = JSON.parse(localStorage.getItem('smartMemos')) || [{ id: Date.now(), title: '첫 번째 메모', content: '' }];
    let currentMemoId = memos[0].id;

    // 초기 실행
    window.onload = () => {
        renderMemoList();
        loadMemo(currentMemoId);
        if(localStorage.getItem('theme') === 'dark') toggleDarkMode(true);
    };

    // 1. 다크 모드 토글
    function toggleDarkMode(isInit) {
        const body = document.body;
        const currentTheme = body.getAttribute('data-theme');
        const newTheme = isInit ? 'dark' : (currentTheme === 'light' ? 'dark' : 'light');
        body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    }

    // 2. 메모 목록 렌더링
    function renderMemoList() {
        const listDiv = document.getElementById('memoItems');
        listDiv.innerHTML = '';
        memos.forEach(memo => {
            const div = document.createElement('div');
            div.className = `memo-item ${memo.id === currentMemoId ? 'active-memo' : ''}`;
            div.innerText = memo.title || '제목 없음';
            div.onclick = () => loadMemo(memo.id);
            listDiv.appendChild(div);
        });
    }

    // 3. 메모 불러오기
    function loadMemo(id) {
        currentMemoId = id;
        const memo = memos.find(m => m.id === id);
        document.getElementById('memoTitle').value = memo.title;
        document.getElementById('memoEditor').value = memo.content;
        renderMemoList();
        updateStatus();
    }

    // 4. 새 메모 생성
    function createNewMemo() {
        const newId = Date.now();
        memos.unshift({ id: newId, title: '새 메모', content: '' });
        currentMemoId = newId;
        saveToLocal();
        loadMemo(newId);
    }

    // 5. 자동 저장 (핵심 기능)
    function autoSave() {
        const title = document.getElementById('memoTitle').value;
        const content = document.getElementById('memoEditor').value;
        
        const index = memos.findIndex(m => m.id === currentMemoId);
        memos[index].title = title;
        memos[index].content = content;

        saveToLocal();
        
        const now = new Date();
        document.getElementById('saveStatus').innerText = `자동 저장됨: ${now.toLocaleTimeString()}`;
        document.getElementById('charCount').innerText = `글자 수: ${content.length}`;
        
        // 목록 실시간 업데이트 (제목 반영)
        const activeItem = document.querySelector('.active-memo');
        if(activeItem) activeItem.innerText = title || '제목 없음';
    }

    function saveToLocal() {
        localStorage.setItem('smartMemos', JSON.stringify(memos));
    }

    // 6. 삭제 기능
    function deleteMemo() {
        if(memos.length <= 1) return alert("최소 한 개의 메모는 있어야 합니다.");
        if(!confirm("정말 삭제할까요?")) return;
        
        memos = memos.filter(m => m.id !== currentMemoId);
        currentMemoId = memos[0].id;
        saveToLocal();
        loadMemo(currentMemoId);
    }

    // 7. PDF 다운로드
    function downloadPDF() {
        const element = document.getElementById('pdf-area');
        const title = document.getElementById('memoTitle').value || 'memo';
        const opt = {
            margin: 1,
            filename: `${title}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    function updateStatus() {
        const content = document.getElementById('memoEditor').value;
        document.getElementById('charCount').innerText = `글자 수: ${content.length}`;
    }
</script>

</body>
</html>
